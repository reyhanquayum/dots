# Subtitle size — use sub-scale (works for ASS in default sub-ass-override=scale mode).
# script-message also fires for non-ASS subs handled by arabic-font.lua.
Alt+UP   add sub-scale  0.1 ; script-message sub-font-adjust  2
Alt+DOWN add sub-scale -0.1 ; script-message sub-font-adjust -2

# speed control
{ add speed -0.25
} add speed 0.25

# mpvacious conflict resolution: keep my scripts on Ctrl+j / Ctrl+g
# and relocate mpvacious's overridden actions to Ctrl+Alt+*
Ctrl+j     script-binding playlist-goto
Ctrl+g     script-binding sub-search-goto
Ctrl+Alt+j script-binding mpvacious-secondary-sid-next
Ctrl+Alt+g script-binding mpvacious-animated-snapshot-toggle
