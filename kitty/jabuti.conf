# Jabuti Colorscheme for Kitty
# Neovim theme source: https://github.com/jabuti-theme/jabuti-nvim

# Foreground color (fg_light)
foreground            #D9E0EE

# Background color (bg_dark)
background            #292A37

# Selection foreground (fg_light, consistent with Normal)
selection_foreground  #D9E0EE

# Selection background (hollow_lighter, used for Visual)
selection_background  #393A4D

# URL color (blue, distinct color for URLs)
url_color             #3FC6DE

# Cursor color (fg, matches Cursor)
cursor                #D9E0EE

# Black (bg_light, darker background shade)
color0   #2E303E

# Bright black (light_grey, brighter black variant)
color8   #44465C

# Red
color1   #EC6A88

# Bright red (heavy_red, brighter red variant)
color9   #E95678

# Green
color2   #3FDAA4

# Bright green (same as color2, no brighter variant defined)
color10  #3FDAA4

# Yellow
color3   #EFB993

# Bright yellow (same as color3, also used for orange)
color11  #EFB993

# Blue
color4   #3FC6DE

# Bright blue (blue_light, brighter blue variant)
color12  #26BBD9

# Magenta
color5   #B072D1

# Bright magenta (pink, brighter magenta variant)
color13  #B771DC

# Cyan
color6   #6BE6E6

# Bright cyan (cyan_dark, slightly darker cyan variant)
color14  #59E3E3

# White
color7   #D9E0EE

# Bright white (same as color7, no brighter variant defined)
color15  #D9E0EE
